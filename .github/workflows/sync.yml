name: Sync Hammerhead → Garmin

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC — adjust to taste
  workflow_dispatch:       # allow manual runs from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: garmin-sync

    steps:
      - uses: actions/checkout@v4

      - name: Restore sync state
        uses: actions/cache@v4
        with:
          path: sync_state.json
          key: sync-state-${{ github.run_id }}
          restore-keys: sync-state-

      - uses: astral-sh/setup-uv@v5

      - name: Run sync
        env:
          SYNC_FROM_DATE: '2026-06-01'
          HAMMERHEAD_CLIENT_ID: ${{ secrets.HAMMERHEAD_CLIENT_ID }}
          HAMMERHEAD_CLIENT_SECRET: ${{ secrets.HAMMERHEAD_CLIENT_SECRET }}
          HAMMERHEAD_USERNAME: ${{ secrets.HAMMERHEAD_USERNAME }}
          HAMMERHEAD_PASSWORD: ${{ secrets.HAMMERHEAD_PASSWORD }}
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: uv run python main.py
