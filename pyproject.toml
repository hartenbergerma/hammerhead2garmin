[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py", "config.py", "state.py", "hammerhead.py", "garmin.py"]

[project]
name = "hammerhead2garmin"
version = "0.1.0"
description = "Sync Hammerhead Karoo activities to Garmin Connect"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "garminconnect>=0.3.5",
    "pyjwt>=2.9.0",
    "requests>=2.32.3",
    "python-dotenv>=1.0",
]

[project.scripts]
hammerhead2garmin = "main:main"
